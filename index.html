<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARWS — Coming Soon</title>
<meta name="description" content="ARWS. Coming soon.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #06070A;
    --ink: #EDF1F7;
    --ink-dim: #7C8494;
    --violet: #FF4433;
    --cyan: #2FD1FF;
    --green: #35E0A1;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:var(--bg); color:var(--ink); font-family:'Space Grotesk',sans-serif;
    min-height:100vh; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
  }
  ::selection{ background:var(--violet); color:#06070A; }

  .glow-bg{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(ellipse 55% 40% at 15% -5%, rgba(255,68,51,0.16), transparent 60%),
      radial-gradient(ellipse 45% 35% at 95% 10%, rgba(47,209,255,0.14), transparent 60%);
  }
  .grain-overlay{
    position:fixed; inset:0; z-index:3; pointer-events:none;
    opacity:0.045; mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  /* ---- Floating gear silhouettes: headset / mouse / keyboard, drifting in the background ---- */
  .float-icon{
    position:fixed; z-index:1; pointer-events:none;
    stroke:currentColor; fill:none; stroke-width:1;
    animation:floatBob ease-in-out infinite;
  }
  .float-icon.fi-headset{ top:10%; left:7%; width:150px; height:150px; color:var(--violet); opacity:0.14; filter:drop-shadow(0 0 30px rgba(255,68,51,0.25)); animation-duration:9s; animation-delay:0s; }
  .float-icon.fi-mouse{ top:62%; right:9%; width:100px; height:100px; color:var(--cyan); opacity:0.13; filter:drop-shadow(0 0 24px rgba(47,209,255,0.25)); animation-duration:7.5s; animation-delay:.6s; }
  .float-icon.fi-keyboard{ bottom:9%; left:12%; width:130px; height:130px; color:var(--green); opacity:0.11; filter:drop-shadow(0 0 24px rgba(53,224,161,0.2)); animation-duration:10.5s; animation-delay:1.2s; }
  @keyframes floatBob{ 0%,100%{ transform:translateY(0) rotate(-3deg); } 50%{ transform:translateY(-18px) rotate(3deg); } }
  @media (max-width:640px){
    .float-icon.fi-headset{ width:100px; height:100px; top:6%; left:4%; }
    .float-icon.fi-mouse{ width:70px; height:70px; top:58%; right:5%; }
    .float-icon.fi-keyboard{ width:90px; height:90px; bottom:6%; left:6%; }
  }

  main{ position:relative; z-index:2; text-align:center; padding:0 6%; }

  .logo{
    display:inline-flex; align-items:center; gap:14px;
    font-weight:700; font-size:clamp(2.6rem, 9vw, 5rem); letter-spacing:6px;
    text-transform:uppercase; color:var(--ink);
  }
  .logo-bars{ display:inline-flex; align-items:flex-end; gap:4px; height:clamp(28px,6vw,42px); }
  .logo-bars span{ width:6px; background:var(--violet); border-radius:2px; animation:barPulse 1.1s ease-in-out infinite; }
  .logo-bars span:nth-child(1){ height:34%; animation-delay:0s; }
  .logo-bars span:nth-child(2){ height:82%; animation-delay:.15s; background:var(--cyan); }
  .logo-bars span:nth-child(3){ height:55%; animation-delay:.3s; }
  .logo-bars span:nth-child(4){ height:100%; animation-delay:.45s; background:var(--cyan); }
  @keyframes barPulse{ 0%,100%{transform:scaleY(0.4);} 50%{transform:scaleY(1);} }

  .logo-letter{ display:inline-block; opacity:0; transform:translateY(18px); animation:logoIn .6s cubic-bezier(.2,.8,.2,1) forwards; }
  .logo-letter:nth-child(1){animation-delay:.05s;}
  .logo-letter:nth-child(2){animation-delay:.16s;}
  .logo-letter:nth-child(3){animation-delay:.27s;}
  .logo-letter:nth-child(4){animation-delay:.38s; color:var(--violet);}
  @keyframes logoIn{ to{opacity:1; transform:translateY(0);} }

  .soon{
    margin-top:26px; font-family:'JetBrains Mono',monospace; font-weight:500;
    font-size:clamp(0.85rem, 2.2vw, 1.05rem); letter-spacing:6px; color:var(--ink-dim);
    text-transform:uppercase;
    opacity:0; animation:fadeUp .7s cubic-bezier(.2,.8,.2,1) .6s forwards;
  }
  .soon .dot{
    display:inline-block; width:6px; height:6px; border-radius:50%;
    background:var(--violet); margin-inline-end:10px; position:relative; top:-2px;
    animation:dotBlink 1.4s ease-in-out infinite;
  }
  @keyframes dotBlink{ 0%,100%{opacity:1;} 50%{opacity:0.25;} }
  @keyframes fadeUp{ from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);} }

  /* ---- Gear chips: a quiet hint of what's landing, no details ---- */
  .gear-chips{
    display:flex; align-items:center; justify-content:center; gap:12px; flex-wrap:wrap;
    margin-top:32px;
  }
  .gear-chip{
    display:inline-flex; align-items:center; justify-content:center;
    width:44px; height:44px; border-radius:50%;
    border:1px solid rgba(237,241,247,0.12);
    opacity:0; transform:translateY(14px);
    transition:opacity .6s cubic-bezier(.2,.8,.2,1), transform .3s ease-out;
    animation:chipGlow 4.5s ease-in-out infinite;
  }
  .gear-chip.in{ opacity:1; }
  .gear-chip svg{ width:19px; height:19px; stroke:currentColor; fill:none; stroke-width:1.6; flex-shrink:0; }
  .gear-chip.gc-headset{ transition-delay:.78s; --glow:rgba(255,68,51,0.55); animation-delay:0s; }
  .gear-chip.gc-headset svg{ color:var(--violet); }
  .gear-chip.gc-mouse{ transition-delay:.9s; --glow:rgba(47,209,255,0.55); animation-delay:1.5s; }
  .gear-chip.gc-mouse svg{ color:var(--cyan); }
  .gear-chip.gc-keyboard{ transition-delay:1.02s; --glow:rgba(53,224,161,0.5); animation-delay:3s; }
  .gear-chip.gc-keyboard svg{ color:var(--green); }
  @keyframes chipGlow{
    0%, 100%{ box-shadow:none; border-color:rgba(237,241,247,0.12); }
    50%{ box-shadow:0 0 18px 2px var(--glow, rgba(255,68,51,0.5)); border-color:var(--glow, rgba(255,68,51,0.6)); }
  }

  .gear-label{
    margin-top:14px; font-family:'JetBrains Mono',monospace; font-size:0.72rem;
    letter-spacing:3px; color:var(--ink-dim); text-transform:uppercase;
    opacity:0; animation:fadeUp .6s cubic-bezier(.2,.8,.2,1) 1.14s forwards;
  }

  @media (prefers-reduced-motion: reduce){
    .logo-letter{animation:none; opacity:1; transform:none;}
    .logo-bars span{animation:none; transform:scaleY(0.8);}
    .soon, .gear-label{animation:none; opacity:1;}
    .soon .dot{animation:none;}
    .float-icon{animation:none;}
    .gear-chip{transition:none; animation:none; opacity:1; transform:none !important; box-shadow:none; border-color:rgba(237,241,247,0.12);}
  }
</style>
</head>
<body>

<div class="glow-bg"></div>

<svg class="float-icon fi-headset" viewBox="0 0 24 24"><path d="M4 13v-1a8 8 0 0116 0v1"/><rect x="2.4" y="13" width="4.2" height="6.4" rx="1.6"/><rect x="17.4" y="13" width="4.2" height="6.4" rx="1.6"/><path d="M19.6 19.4v.8a2 2 0 01-2 2h-2.2"/></svg>
<svg class="float-icon fi-mouse" viewBox="0 0 24 24"><rect x="6" y="3" width="12" height="18" rx="6"/><line x1="12" y1="3" x2="12" y2="9"/></svg>
<svg class="float-icon fi-keyboard" viewBox="0 0 24 24"><rect x="2" y="5.5" width="20" height="13" rx="2"/><line x1="5" y1="9.3" x2="5.01" y2="9.3"/><line x1="8" y1="9.3" x2="8.01" y2="9.3"/><line x1="11" y1="9.3" x2="11.01" y2="9.3"/><line x1="14" y1="9.3" x2="14.01" y2="9.3"/><line x1="17" y1="9.3" x2="17.01" y2="9.3"/><line x1="19" y1="9.3" x2="19.01" y2="9.3"/><line x1="5" y1="12.3" x2="5.01" y2="12.3"/><line x1="8" y1="12.3" x2="8.01" y2="12.3"/><line x1="11" y1="12.3" x2="11.01" y2="12.3"/><line x1="14" y1="12.3" x2="14.01" y2="12.3"/><line x1="17" y1="12.3" x2="17.01" y2="12.3"/><line x1="19" y1="12.3" x2="19.01" y2="12.3"/><rect x="7" y="15.2" width="10" height="1.5" rx="0.75" fill="currentColor" stroke="none"/></svg>

<div class="grain-overlay"></div>

<main>
  <div class="logo">
    <span class="logo-bars"><span></span><span></span><span></span><span></span></span>
    <span><span class="logo-letter">A</span><span class="logo-letter">R</span><span class="logo-letter">W</span><span class="logo-letter">S</span></span>
  </div>
  <div class="soon"><span class="dot"></span>Coming soon</div>

  <div class="gear-chips">
    <div class="gear-chip gc-headset"><svg viewBox="0 0 24 24"><path d="M4 13v-1a8 8 0 0116 0v1"/><rect x="2.4" y="13" width="4.2" height="6.4" rx="1.6"/><rect x="17.4" y="13" width="4.2" height="6.4" rx="1.6"/></svg></div>
    <div class="gear-chip gc-mouse"><svg viewBox="0 0 24 24"><rect x="6" y="3" width="12" height="18" rx="6"/><line x1="12" y1="3" x2="12" y2="9"/></svg></div>
    <div class="gear-chip gc-keyboard"><svg viewBox="0 0 24 24"><rect x="2" y="5.5" width="20" height="13" rx="2"/><rect x="7" y="15.2" width="10" height="1.5" rx="0.75" fill="currentColor" stroke="none"/></svg></div>
  </div>
  <div class="gear-label">Gaming Accessories</div>
</main>

<script>
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const chips = document.querySelectorAll('.gear-chip');

  // Entrance: add .in one frame after paint so the opacity transition actually runs.
  requestAnimationFrame(() => requestAnimationFrame(() => {
    chips.forEach(el => el.classList.add('in'));
  }));

  // Subtle parallax: the three circles drift slightly toward the cursor, each at a
  // different depth, for a light 3D feel without moving anything else on the page.
  if(!reduceMotion && window.matchMedia('(hover: hover) and (pointer: fine)').matches){
    const depth = { 'gc-headset':0.6, 'gc-mouse':0.9, 'gc-keyboard':0.75 };
    window.addEventListener('mousemove', (e) => {
      const dx = (e.clientX / window.innerWidth) - 0.5;
      const dy = (e.clientY / window.innerHeight) - 0.5;
      chips.forEach(chip => {
        const key = Object.keys(depth).find(k => chip.classList.contains(k));
        const m = depth[key] || 0.7;
        chip.style.transform = `translate(${dx*16*m}px, ${dy*16*m}px)`;
      });
    });
  }
</script>

</body>
</html>
